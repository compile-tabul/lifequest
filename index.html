<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LifeQuest — Track Your Life</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          bg: '#0f0f14',
          panel: '#18181f',
          border: '#27272f',
          accent: '#7c5cff',
          accent2: '#4ade80',
        },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
      }
    }
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { scrollbar-width: thin; scrollbar-color: #27272f transparent; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-thumb { background: #27272f; border-radius: 4px; }
  .nav-item { display:flex; align-items:center; gap:0.6rem; padding:0.5rem 0.75rem; border-radius:0.5rem; font-size:0.875rem; color:#9ca3af; transition:all 0.15s; text-decoration:none; cursor:pointer; }
  .nav-item:hover { background:#0f0f14; color:#e5e7eb; }
  .nav-item.active { background:rgba(124,92,255,0.15); color:#a78bfa; font-weight:600; }
  #xpBar, #hpBar { transition: width 0.4s ease-out; }
  .toast { position:fixed; bottom:1.5rem; right:1.5rem; background:#18181f; border:1px solid #27272f; padding:0.75rem 1rem; border-radius:0.5rem; font-size:0.875rem; z-index:100; animation:slideIn 0.3s ease-out; box-shadow:0 10px 30px rgba(0,0,0,0.4); }
  @keyframes slideIn { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }
  .loader { border:3px solid #27272f; border-top:3px solid #7c5cff; border-radius:50%; width:40px; height:40px; animation:spin 0.8s linear infinite; margin:2rem auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-bg text-gray-200 font-sans min-h-screen">

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="fixed inset-0 flex items-center justify-center bg-bg z-50">
  <div class="text-center max-w-md px-6">
    <div class="text-6xl mb-4">🎮</div>
    <h1 class="text-4xl font-extrabold mb-2 bg-gradient-to-r from-accent to-accent2 bg-clip-text text-transparent">LifeQuest</h1>
    <p class="text-gray-400 mb-8">Track your life. Level up yourself.</p>
    <button id="btnLogin" class="bg-accent hover:bg-accent/80 transition px-6 py-3 rounded-lg font-semibold text-white inline-flex items-center gap-3 shadow-lg shadow-accent/20">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C41 35.3 44 30 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
      Login dengan Google
    </button>
    <p id="loginError" class="text-red-400 text-sm mt-4 hidden"></p>
  </div>
</div>

<!-- LOADING -->
<div id="loadingScreen" class="fixed inset-0 flex items-center justify-center bg-bg z-40 hidden">
  <div class="text-center">
    <div class="loader"></div>
    <p class="text-gray-400 text-sm">Memuat data...</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="flex h-screen overflow-hidden">
    <aside class="w-64 bg-panel border-r border-border flex-shrink-0 flex flex-col">
      <div class="p-4 border-b border-border">
        <div class="flex items-center gap-2 mb-4">
          <span class="text-2xl">🎮</span>
          <span class="font-extrabold text-lg bg-gradient-to-r from-accent to-accent2 bg-clip-text text-transparent">LifeQuest</span>
        </div>
        <div class="flex items-center gap-3 p-2 rounded-lg bg-bg/50">
          <img id="userPhoto" class="w-9 h-9 rounded-full" alt="" />
          <div class="flex-1 min-w-0">
            <div id="userName" class="text-sm font-semibold truncate">...</div>
            <div id="userLevel" class="text-xs text-gray-400">Level 1</div>
          </div>
        </div>
      </div>
      <nav class="flex-1 overflow-y-auto p-3 space-y-1">
        <div class="text-xs font-semibold text-gray-500 uppercase px-3 pt-3 pb-1">Utama</div>
        <a data-page="dashboard" class="nav-item active">📊 Dashboard</a>
        <a data-page="habits" class="nav-item">🔥 Habits</a>
        <a data-page="tasks" class="nav-item">✅ Tasks</a>
        <div class="text-xs font-semibold text-gray-500 uppercase px-3 pt-4 pb-1">Kehidupan</div>
        <a data-page="journal" class="nav-item">📔 Journal</a>
        <a data-page="goals" class="nav-item">🎯 Goals</a>
        <a data-page="finance" class="nav-item">💰 Finance</a>
        <a data-page="notes" class="nav-item">📝 Notes</a>
        <div class="text-xs font-semibold text-gray-500 uppercase px-3 pt-4 pb-1">Karakter</div>
        <a data-page="avatar" class="nav-item">🧙 Avatar</a>
        <a data-page="shop" class="nav-item">🛒 Shop</a>
        <a data-page="stats" class="nav-item">📈 Stats</a>
        <div class="text-xs font-semibold text-gray-500 uppercase px-3 pt-4 pb-1">Lainnya</div>
        <a data-page="settings" class="nav-item">⚙️ Settings</a>
      </nav>
      <div class="p-3 border-t border-border">
        <button id="btnLogout" class="w-full text-sm text-gray-400 hover:text-red-400 transition px-3 py-2 rounded-lg hover:bg-bg text-left">🚪 Logout</button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
      <header class="bg-panel border-b border-border px-6 py-3 flex items-center gap-4 flex-wrap">
        <div class="flex items-center gap-2">
          <span class="text-lg">❤️</span>
          <div class="w-32 h-2 bg-bg rounded-full overflow-hidden"><div id="hpBar" class="h-full bg-red-500" style="width:100%"></div></div>
          <span id="hpText" class="text-xs text-gray-400 font-mono">100/100</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-lg">⭐</span>
          <div class="w-32 h-2 bg-bg rounded-full overflow-hidden"><div id="xpBar" class="h-full bg-accent" style="width:0%"></div></div>
          <span id="xpText" class="text-xs text-gray-400 font-mono">0/100</span>
        </div>
        <div class="flex items-center gap-1.5"><span class="text-lg">🪙</span><span id="goldText" class="text-sm font-semibold">0</span></div>
        <div class="flex items-center gap-1.5"><span class="text-lg">🔥</span><span id="streakText" class="text-sm font-semibold">0</span></div>
        <div class="flex-1"></div>
        <div class="bg-accent/20 border border-accent/40 rounded-lg px-3 py-1">
          <span class="text-xs text-gray-400">Level</span>
          <span id="levelText" class="text-lg font-bold text-accent ml-1">1</span>
        </div>
      </header>
      <div id="content" class="flex-1 overflow-y-auto p-6"></div>
    </main>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getDatabase, ref, get, set, update, onValue } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAx8Dr9iRq2wte15pMQEgKJKkq4tcYPwAM",
  authDomain: "life-update-50a09.firebaseapp.com",
  databaseURL: "https://life-update-50a09-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "life-update-50a09",
  storageBucket: "life-update-50a09.firebasestorage.app",
  messagingSenderId: "235547119353",
  appId: "1:235547119353:web:98a658126c04cfc09a9c28"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const googleProvider = new GoogleAuthProvider();

const state = { user: null, profile: null, currentPage: "dashboard" };

// ===== UI HELPERS =====
const $ = (id) => document.getElementById(id);
const loginScreen = $("loginScreen");
const loadingScreen = $("loadingScreen");
const appEl = $("app");
const btnLogin = $("btnLogin");
const btnLogout = $("btnLogout");
const loginError = $("loginError");

function toast(msg, type = "info") {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  if (type === "success") el.style.borderColor = "#4ade80";
  if (type === "error") el.style.borderColor = "#ef4444";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ===== AUTH =====
btnLogin.addEventListener("click", async () => {
  try {
    btnLogin.disabled = true;
    btnLogin.textContent = "Loading...";
    await signInWithPopup(auth, googleProvider);
  } catch (err) {
    console.error(err);
    loginError.textContent = "Gagal login: " + err.message;
    loginError.classList.remove("hidden");
    btnLogin.disabled = false;
    btnLogin.textContent = "Login dengan Google";
  }
});

btnLogout.addEventListener("click", async () => {
  if (confirm("Yakin mau logout?")) await signOut(auth);
});

onAuthStateChanged(auth, async (user) => {
  if (user) {
    state.user = user;
    loginScreen.classList.add("hidden");
    loadingScreen.classList.remove("hidden");

    $("userPhoto").src = user.photoURL || "";
    $("userName").textContent = user.displayName || "Player";

    // Init profile
    const profileRef = ref(db, `users/${user.uid}/profile`);
    const snap = await get(profileRef);
    if (!snap.exists()) {
      await set(profileRef, {
        nama: user.displayName || "Player",
        photo: user.photoURL || "",
        level: 1, xp: 0, xpNeeded: 100,
        gold: 0, hp: 100, hpMax: 100,
        streak: 0, lastLogin: Date.now(),
        createdAt: Date.now()
      });
    } else {
      await update(profileRef, { lastLogin: Date.now() });
    }

    // Listen profile
    onValue(profileRef, (s) => {
      if (!s.exists()) return;
      state.profile = s.val();
      renderTopBar(state.profile);
      if (state.currentPage === "dashboard") renderDashboard();
    });

    loadingScreen.classList.add("hidden");
    appEl.classList.remove("hidden");
    navigateTo("dashboard");
  } else {
    state.user = null;
    state.profile = null;
    loginScreen.classList.remove("hidden");
    loadingScreen.classList.add("hidden");
    appEl.classList.add("hidden");
    btnLogin.disabled = false;
    btnLogin.textContent = "Login dengan Google";
  }
});

// ===== TOP BAR =====
function renderTopBar(p) {
  $("hpBar").style.width = (p.hp / p.hpMax * 100) + "%";
  $("hpText").textContent = `${p.hp}/${p.hpMax}`;
  $("xpBar").style.width = (p.xp / p.xpNeeded * 100) + "%";
  $("xpText").textContent = `${p.xp}/${p.xpNeeded}`;
  $("goldText").textContent = p.gold;
  $("streakText").textContent = p.streak;
  $("levelText").textContent = p.level;
  $("userLevel").textContent = `Level ${p.level}`;
}

// ===== NAVIGASI =====
document.querySelectorAll(".nav-item").forEach((item) => {
  item.addEventListener("click", () => navigateTo(item.dataset.page));
});

function navigateTo(page) {
  state.currentPage = page;
  document.querySelectorAll(".nav-item").forEach((i) => i.classList.toggle("active", i.dataset.page === page));
  const content = $("content");
  const pages = {
    dashboard: renderDashboard,
    habits: () => renderPlaceholder("🔥 Habits", "Fitur habits akan datang di update berikutnya"),
    tasks: () => renderPlaceholder("✅ Tasks", "Fitur tasks akan datang di update berikutnya"),
    journal: () => renderPlaceholder("📔 Journal", "Fitur journal akan datang"),
    goals: () => renderPlaceholder("🎯 Goals", "Fitur goals akan datang"),
    finance: () => renderPlaceholder("💰 Finance", "Fitur finance akan datang"),
    notes: () => renderPlaceholder("📝 Notes", "Fitur notes akan datang"),
    avatar: () => renderPlaceholder("🧙 Avatar", "Fitur avatar akan datang"),
    shop: () => renderPlaceholder("🛒 Shop", "Fitur shop akan datang"),
    stats: () => renderPlaceholder("📈 Stats", "Fitur stats akan datang"),
    settings: () => renderPlaceholder("⚙️ Settings", "Fitur settings akan datang"),
  };
  content.innerHTML = "";
  (pages[page] || renderDashboard)();
}

function renderPlaceholder(title, subtitle) {
  $("content").innerHTML = `
    <div class="flex flex-col items-center justify-center h-full text-center">
      <div class="text-6xl mb-4">🚧</div>
      <h2 class="text-2xl font-bold mb-2">${title}</h2>
      <p class="text-gray-400">${subtitle}</p>
    </div>`;
}

function renderDashboard() {
  const p = state.profile || {};
  $("content").innerHTML = `
    <div class="max-w-4xl">
      <h1 class="text-3xl font-bold mb-1">Halo, ${p.nama || "Player"} 👋</h1>
      <p class="text-gray-400 mb-8">Selamat datang di LifeQuest.</p>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div class="bg-panel border border-border rounded-xl p-5">
          <div class="text-3xl mb-2">⭐</div>
          <div class="text-2xl font-bold">${p.xp || 0} XP</div>
          <div class="text-sm text-gray-400">Total XP</div>
        </div>
        <div class="bg-panel border border-border rounded-xl p-5">
          <div class="text-3xl mb-2">🪙</div>
          <div class="text-2xl font-bold">${p.gold || 0}</div>
          <div class="text-sm text-gray-400">Gold</div>
        </div>
        <div class="bg-panel border border-border rounded-xl p-5">
          <div class="text-3xl mb-2">🔥</div>
          <div class="text-2xl font-bold">${p.streak || 0} hari</div>
          <div class="text-sm text-gray-400">Streak</div>
        </div>
      </div>
      <div class="bg-panel border border-border rounded-xl p-6">
        <h3 class="font-bold mb-2">🎉 Selamat! Login Berhasil</h3>
        <p class="text-gray-400 text-sm">Fondasi aplikasi udah jalan. Lanjut ke update berikutnya buat fitur Habits & Tasks.</p>
      </div>
    </div>`;
}
</script>
</body>
</html>
